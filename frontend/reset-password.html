<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose New Password - Recon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-wrapper">
        <section class="login-card card">
            <div class="logo">Recon<span>Flow</span></div>
            <h1>Choose a new password</h1>
            <p>Use at least 8 characters.</p>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="password">New password</label>
                    <input id="password" type="password" minlength="8" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
                </div>
                <button class="btn btn-primary" type="submit">Update password</button>
            </form>
            <p id="formMessage" class="form-message" aria-live="polite"></p>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/password-reset.js"></script>
</body>
</html>
